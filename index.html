<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jarvis">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%230b1020'/%3E%3Ccircle cx='90' cy='90' r='52' fill='none' stroke='%234cc9f0' stroke-width='8'/%3E%3Ccircle cx='90' cy='90' r='18' fill='%234cc9f0'/%3E%3C/svg%3E">
<title>Jarvis</title>
<style>
:root{--bg:#0b1020;--card:#151c33;--acc:#4cc9f0;--tx:#e8ecf8;--mut:#8b95b8}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:16px -apple-system,system-ui,sans-serif;display:flex;flex-direction:column;
padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px}
h1{font-size:18px;margin:0;color:var(--acc);letter-spacing:.2em}
.ic{border:0;background:none;color:var(--tx);font-size:22px;padding:6px 8px}
#log{flex:1;overflow-y:auto;padding:8px 16px;display:flex;flex-direction:column;gap:8px}
.b{max-width:85%;padding:10px 14px;border-radius:16px;background:var(--card);line-height:1.4;overflow-wrap:anywhere;white-space:pre-wrap}
.me{align-self:flex-end;background:var(--acc);color:#04121c}
.b a{color:var(--acc);font-weight:600}
.sys{align-self:center;color:var(--mut);font-size:13px;background:none;text-align:center}
form{display:flex;gap:8px;padding:12px 16px}
input,select{padding:12px 14px;border-radius:24px;border:1px solid #2a3560;background:var(--card);color:var(--tx);font-size:16px;width:100%}
#t{flex:1;min-width:0}
.rb{border:0;border-radius:50%;width:48px;height:48px;flex:none;background:var(--card);color:var(--tx);font-size:20px}
.rb.on{background:#e63946}
dialog{background:var(--card);color:var(--tx);border:1px solid #2a3560;border-radius:16px;width:min(92vw,420px)}
dialog::backdrop{background:#000a}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
dialog input,dialog select{border-radius:10px}
.row{display:flex;gap:8px;margin-top:16px}.row button{flex:1;padding:12px;border-radius:10px;border:0;background:var(--acc);color:#04121c;font-weight:600;font-size:16px}
.row button.g{background:#2a3560;color:var(--tx)}
small{color:var(--mut);display:block;margin-top:8px;line-height:1.4}
</style></head><body>
<header><h1>JARVIS</h1><span><button class="ic" id="vol" aria-label="Toggle voice replies">🔊</button><button class="ic" id="gear" aria-label="Settings">⚙︎</button></span></header>
<div id="log"></div>
<form id="f"><button type="button" class="rb" id="mic" aria-label="Microphone">🎤</button>
<input id="t" placeholder="Ask Jarvis…  (Ctrl+Space to talk)" autocomplete="off"><button class="rb" aria-label="Send">➤</button></form>

<dialog id="dlg"><form method="dialog" id="sf" style="padding:0">
<h3 style="margin:0 0 4px">Settings</h3>
<label>Provider preset</label>
<select id="pre"><option value="">Custom</option>
<option value="https://api.groq.com/openai/v1|llama-3.1-8b-instant">Groq (free tier)</option>
<option value="https://openrouter.ai/api/v1|meta-llama/llama-3.3-70b-instruct:free">OpenRouter (free models)</option>
<option value="http://localhost:11434/v1|llama3.2">Ollama on this computer</option>
<option value="http://localhost:8080/v1|local">llama.cpp on this computer</option></select>
<label>API base URL (OpenAI-compatible)</label><input id="url" autocapitalize="off" autocorrect="off">
<label>Model</label><input id="model" autocapitalize="off" autocorrect="off">
<label>API key (blank for local servers)</label><input id="key" type="password" autocomplete="off">
<label>Voice language</label><input id="lang" placeholder="en-US">
<h3 style="margin:18px 0 0">Custom voice (ElevenLabs)</h3>
<label>ElevenLabs API key</label><input id="el" type="password" autocomplete="off" autocapitalize="off">
<label>Voice ID (from your ElevenLabs voice's page)</label><input id="elv" autocapitalize="off" autocorrect="off">
<label>Model</label><select id="elm"><option value="eleven_flash_v2_5">Flash v2.5 (fast, cheaper)</option><option value="eleven_multilingual_v2">Multilingual v2 (higher quality)</option></select>
<div class="row"><button type="button" class="g" id="tv">▶ Test voice</button></div>
<small>Leave key or Voice ID blank to use your device's built-in voice. Stored only in this browser (localStorage). Keys go straight from your device to the provider — there is no Jarvis server. Voice usage counts against your ElevenLabs quota.</small>
<div class="row"><button class="g" value="cancel">Close</button><button value="ok" id="save">Save</button></div>
</form></dialog>

<script>
const $=id=>document.getElementById(id), log=$('log');
const S=Object.assign({url:'',model:'',key:'',lang:'en-US',voice:true,el:'',elVoice:'',elModel:'eleven_flash_v2_5'},JSON.parse(localStorage.getItem('jarvis')||'{}'));
const save=()=>localStorage.setItem('jarvis',JSON.stringify(S));
let hist=[];

/* ---------- UI helpers ---------- */
function add(t,cls,url){const d=document.createElement('div');d.className='b '+(cls||'');d.textContent=t;
 if(url){d.append(' ');const a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener';a.textContent='Open ↗';d.append(a)}
 log.append(d);log.scrollTop=log.scrollHeight}
const player=new Audio();let unlocked=false;
// iOS only lets audio play after a tap; unlock the shared player on the first gesture.
function unlock(){if(unlocked)return;unlocked=true;
 player.src='data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=';player.play().catch(()=>{})}
addEventListener('pointerdown',unlock,{once:true});
function stopSpeech(){try{speechSynthesis.cancel()}catch{}player.pause()}
function browserSpeak(t){if(!('speechSynthesis' in window))return;speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(t);u.lang=S.lang;speechSynthesis.speak(u)}
async function speak(t,force){
 if(!S.voice&&!force)return;
 if(S.el&&S.elVoice){
  try{
   const r=await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${encodeURIComponent(S.elVoice)}?output_format=mp3_44100_128`,
    {method:'POST',headers:{'xi-api-key':S.el,'Content-Type':'application/json'},
     body:JSON.stringify({text:t,model_id:S.elModel||'eleven_flash_v2_5'})});
   if(!r.ok)throw new Error(r.status+' '+(await r.text()).slice(0,140));
   stopSpeech();player.src=URL.createObjectURL(await r.blob());await player.play();return;
  }catch(e){add('ElevenLabs error, using device voice: '+e.message,'sys')}
 }
 browserSpeak(t)}
$('vol').textContent=S.voice?'🔊':'🔇';
$('vol').onclick=()=>{S.voice=!S.voice;save();$('vol').textContent=S.voice?'🔊':'🔇';stopSpeech()};

/* ---------- Tools (the LLM can ONLY call these) ---------- */
const q=a=>encodeURIComponent(a.query||'');
const TOOLS={
 time:{d:'Current date and time. args: {}',run:()=>({say:new Date().toLocaleString([], {dateStyle:'full',timeStyle:'short'})})},
 web_search:{d:'Google search. args: {"query": str}',run:a=>({say:`Searching for ${a.query}.`,url:`https://www.google.com/search?q=${q(a)}`})},
 youtube:{d:'Search YouTube. args: {"query": str}',run:a=>({say:`YouTube results for ${a.query}.`,url:`https://www.youtube.com/results?search_query=${q(a)}`})},
 spotify:{d:'Search Spotify (opens the Spotify app if installed). args: {"query": str}',run:a=>({say:`Spotify search for ${a.query}.`,url:`https://open.spotify.com/search/${q(a)}`})},
 apple_music:{d:'Search Apple Music. args: {"query": str}',run:a=>({say:`Apple Music search for ${a.query}.`,url:`https://music.apple.com/search?term=${q(a)}`})},
 maps:{d:'Directions/places. args: {"query": str}',run:a=>({say:`Map for ${a.query}.`,url:`https://www.google.com/maps/search/?api=1&query=${q(a)}`})},
 timer:{d:'Set a timer that speaks when done. args: {"seconds": number, "label": str}',run:a=>{
  const s=Math.max(1,Math.min(86400,+a.seconds||60));
  setTimeout(()=>{const m=`Timer done${a.label?': '+a.label:''}.`;add(m,'');speak(m);navigator.vibrate&&navigator.vibrate(300)},s*1000);
  return {say:`Timer set for ${s>=60?Math.round(s/60)+' minutes':s+' seconds'}. Keep this tab open.`}}}
};
const sysPrompt=()=>`You are Jarvis, a concise, witty personal assistant. To use a tool, reply with ONLY a JSON object: {"tool":"<name>","args":{...}}. Otherwise answer in plain text, 1-3 short sentences.\nTools:\n`+Object.entries(TOOLS).map(([n,t])=>`- ${n}: ${t.d}`).join('\n');

/* ---------- LLM ---------- */
async function ask(text){
 if(!S.url||!S.model){add('Open ⚙︎ and pick a provider first.','sys');return}
 hist.push({role:'user',content:text});hist=hist.slice(-10);
 add('…','sys');const ph=log.lastChild;
 try{
  const r=await fetch(S.url.replace(/\/$/,'')+'/chat/completions',{method:'POST',
   headers:Object.assign({'Content-Type':'application/json'},S.key?{Authorization:'Bearer '+S.key}:{}),
   body:JSON.stringify({model:S.model,temperature:0.3,max_tokens:400,messages:[{role:'system',content:sysPrompt()},...hist]})});
  if(!r.ok)throw new Error(r.status+' '+(await r.text()).slice(0,160));
  const out=(await r.json()).choices[0].message.content.trim();
  ph.remove();let res={say:out};
  const m=out.match(/\{[\s\S]*\}/);
  if(m){try{const c=JSON.parse(m[0]);if(c.tool&&TOOLS[c.tool])res=await TOOLS[c.tool].run(c.args||{})}catch{}}
  hist.push({role:'assistant',content:res.say});
  add(res.say,'',res.url);speak(res.say);
  if(res.url)try{window.open(res.url,'_blank','noopener')}catch{}
 }catch(e){ph.remove();add('Error: '+e.message,'sys')}
}
function send(t){t=t.trim();if(!t)return;add(t,'me');ask(t)}
$('f').onsubmit=e=>{e.preventDefault();send($('t').value);$('t').value=''};

/* ---------- Voice input (Web Speech API; needs HTTPS — GitHub Pages is) ---------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function listen(){
 if(!SR)return add('Voice input isn’t supported in this browser — type instead.','sys');
 stopSpeech();const r=new SR();r.lang=S.lang;
 r.onstart=()=>$('mic').classList.add('on');r.onend=()=>$('mic').classList.remove('on');
 r.onresult=e=>send(e.results[0][0].transcript);r.onerror=e=>add('Mic: '+e.error,'sys');r.start()}
$('mic').onclick=listen;
addEventListener('keydown',e=>{if(e.ctrlKey&&e.code==='Space'){e.preventDefault();listen()}});

/* ---------- Settings ---------- */
const dlg=$('dlg');
$('gear').onclick=()=>{$('url').value=S.url;$('model').value=S.model;$('key').value=S.key;$('lang').value=S.lang;$('el').value=S.el;$('elv').value=S.elVoice;$('elm').value=S.elModel;$('pre').value='';dlg.showModal()};
$('pre').onchange=e=>{if(e.target.value){const[u,m]=e.target.value.split('|');$('url').value=u;$('model').value=m}};
$('save').onclick=()=>{S.url=$('url').value.trim();S.model=$('model').value.trim();S.key=$('key').value.trim();S.lang=$('lang').value.trim()||'en-US';S.el=$('el').value.trim();S.elVoice=$('elv').value.trim();S.elModel=$('elm').value;save()};
$('tv').onclick=()=>{S.el=$('el').value.trim();S.elVoice=$('elv').value.trim();S.elModel=$('elm').value;speak('At your service. How can I help?',true)};

add('Hi, I’m Jarvis. '+(S.url?'Tap 🎤 or type.':'Tap ⚙︎ to choose a free AI provider and add your key.'),'sys');
</script></body></html>
